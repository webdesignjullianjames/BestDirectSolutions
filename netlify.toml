[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires ^20.19 || >=22.12. Pinned so a change to Netlify's default
  # image cannot silently move the build onto an unsupported runtime.
  NODE_VERSION = "22"

# The app routes client-side with react-router-dom, so paths like /about, /team
# and /contact have no file behind them on disk. Without this rule Netlify would
# 404 anyone who deep-links, refreshes, or hits those URLs from search — only
# the bare "/" would work. The 200 status rewrites rather than redirects, so the
# browser keeps the real URL and React Router resolves it on the client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable — Vite renames them on every content change,
# so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media and fonts live in public/ and ship under their own names, so unlike
# /assets/* they are NOT content-hashed — "immutable" would be a lie here, and
# replacing a photo would leave stale copies pinned in browser caches for a
# year with no way to bust them.
#
# Without any rule they fall through to Netlify's default, which revalidates on
# every visit; that is a round trip per image on each page, and this site
# carries tens of megabytes of them. A week of max-age with stale-while-
# revalidate makes repeat visits free while keeping a swapped file's turnaround
# short: the next request after expiry serves from cache and refreshes in the
# background. Anything urgent can still be forced through by renaming the file.
[[headers]]
  for = "/Company Images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Fonts change essentially never and are already referenced by exact name from
# index.css, so they get a longer window than the photos.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Icons are requested on every page load and turn over rarely.
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
